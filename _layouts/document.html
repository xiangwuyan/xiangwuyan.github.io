<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | Xiang-Wu Yan</title>
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 880px; margin: 0 auto; padding: 32px 24px 64px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.75; color: #263238; background: #fff; overflow-wrap: anywhere; }
    a { color: #245a85; text-underline-offset: 3px; }
    .back { font-size: 14px; }
    h1 { font-size: 2rem; line-height: 1.25; margin: 32px 0 24px; }
    h2 { font-size: 1.35rem; margin-top: 36px; border-bottom: 1px solid #dfe3e6; padding-bottom: 8px; }
    h3 { font-size: 1.1rem; margin-top: 28px; }
    li { margin-bottom: 18px; }
    table { border-collapse: collapse; width: 100%; font-size: .92rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #dfe3e6; vertical-align: top; }
    @media (max-width: 600px) { body { padding: 20px 16px 40px; } h1 { font-size: 1.7rem; } th, td { padding: 7px 4px; } }
    @media (prefers-color-scheme: dark) { body { color: #e3e7eb; background: #171b20; } a { color: #8ec5ef; } h2, th, td { border-color: #39434d; } }
  </style>
</head>
<body>
  <a class="back" href="{{ '/' | relative_url }}">Return to homepage</a>
  <main>{{ content }}</main>
</body>
</html>
